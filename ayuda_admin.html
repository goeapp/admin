// ║              MOTOR DE RENDER — no modificar                     ║

(function render() {
  const C = CONTENIDO, $ = id => document.getElementById(id);

  document.title = C.paginaTitulo;
  $('hdr-eyebrow').innerHTML  = C.header.eyebrow;
  $('hdr-title').innerHTML    = C.header.titulo;
  $('hdr-subtitle').innerHTML = C.header.subtitulo;

  // Índice
  $('indice').innerHTML = `<a href="#sec-resumen"><span class="n">0</span>Resumen</a>` +
    C.modulos.map((m, i) => `<a href="#mod-${m.id}"><span class="n">${i + 1}</span>${m.icon} ${m.nombre.split(' · ')[0]}</a>`).join('');

  // Resumen
  const r = C.resumen;
  $('sec-resumen').innerHTML = `
    <p class="section-label">${r.labelSeccion}</p>
    <div class="intro-card"><p>${r.parrafo}</p>
      <div class="flow">${r.pasos.map((p, i) => `
        <div class="flow-step"><div class="step-num">${i + 1}</div>
          <div class="step-body">
            <div class="step-title">${p.titulo}${p.ir ? `<a href="#mod-${p.ir}">ver ›</a>` : ''}</div>
            ${p.detalle ? `<div class="step-detail">${p.detalle}</div>` : ''}
          </div></div>`).join('')}
      </div></div>`;

  // Reglas
  const g = C.reglas;
  $('sec-reglas').innerHTML = `
    <p class="section-label">${g.labelSeccion}</p>
    <div class="regla-grid">${g.items.map(t => `
      <div class="regla"><div class="regla-icon">${t.icon}</div>
        <div class="regla-title">${t.titulo}</div><div class="regla-text">${t.texto}</div></div>`).join('')}
    </div>`;

  // Módulos
  $('sec-modulos').innerHTML = C.modulos.map((m, i) => `
    <section class="section" id="mod-${m.id}">
      <p class="section-label">Módulo ${i + 1}</p>
      <div class="mod">
        <div class="mod-head"><span class="mod-n">${i + 1}</span><span class="mod-icon">${m.icon}</span>
          <div><div class="mod-name">${m.nombre}</div><div class="mod-para">${m.para}</div></div></div>
        <div class="mod-body">
          ${m.antes && m.antes.length ? `<div class="bloque"><div class="bloque-tit">Antes de empezar</div>
            <ul class="antes">${m.antes.map(a => `<li>${a}</li>`).join('')}</ul></div>` : ''}
          <div class="bloque"><div class="bloque-tit">Pasos</div>
            <ol class="pasos">${m.pasos.map(p => `<li><div>
              <div class="paso-tit">${p.titulo}</div>
              ${p.detalle ? `<div class="paso-det">${p.detalle}</div>` : ''}
              ${p.sub && p.sub.length ? `<ul class="sub">${p.sub.map(s => `<li>${s}</li>`).join('')}</ul>` : ''}
            </div></li>`).join('')}</ol></div>
          ${m.cuidado && m.cuidado.length ? `<div class="bloque"><div class="bloque-tit">Cuidado</div>
            <div class="cuidado"><ul>${m.cuidado.map(c => `<li>${c}</li>`).join('')}</ul></div></div>` : ''}
        </div>
      </div>
      <a class="arriba" href="#arriba">↑ Volver al índice</a>
    </section>`).join('');

  // Footer
  $('pie').innerHTML = `<div>${C.footer.izquierda}</div><div>${C.footer.derecha}</div>`;
})();
</script>
